<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14072A">
<meta name="robots" content="noindex">
<title>Ludo Queen – Admin</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1B2A7A;--bg2:#0B1238;--card:rgba(10,18,70,.72);--surface:rgba(255,255,255,.07);--surface2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.16);--text:#F4F6FF;--muted:#AEB7E0;--gold:#FFC107;--green:#2FA84F;--red:#E53935;--blue:#4FC3F7;
}
*{box-sizing:border-box}
html{background:var(--bg2)}
html,body{margin:0;min-height:100%;color:var(--text);}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--bg1),var(--bg2)) no-repeat;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1;margin:0}
.logo span{color:var(--gold)}
.logo small{font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:var(--muted);margin-left:8px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;vertical-align:middle}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.who b{color:var(--text)}
.btn{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.gold{background:linear-gradient(#FFD54F,#FFA000);color:#4A2A00;border-color:transparent}
.btn.danger{background:linear-gradient(#EF5350,#C62828);border-color:transparent}
.btn.ok{background:linear-gradient(#43C463,#1E9A47);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .n{font-family:'Baloo 2',sans-serif;font-size:30px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat.warn .n{color:#FF8A80}.stat.good .n{color:#8EE6A2}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1 1 200px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(5,10,40,.55);padding:0 12px;font-size:14px;min-width:0}
.search:focus,select:focus{outline:none;border-color:var(--blue)}
select{height:38px;border-radius:11px;border:1px solid var(--line);background:#121c55;padding:0 10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--surface2);color:#fff;border-color:rgba(255,255,255,.35)}
.users{display:flex;flex-direction:column;gap:8px}
.user{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.user.blocked{border-color:rgba(229,57,53,.55);background:rgba(229,57,53,.08)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:linear-gradient(#4FC3F7,#1E88E5);position:relative;flex:none}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#43C463;border:2px solid #101a52}
.uinfo{min-width:0}
.uname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.uname button{background:none;border:none;padding:0;font-weight:700;font-size:15px;cursor:pointer;color:var(--text);text-align:left}
.uname button:hover{text-decoration:underline}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.badge.admin{background:var(--gold);color:#4A2A00}
.badge.blocked{background:var(--red);color:#fff}
.badge.you{background:var(--surface2);color:var(--muted)}
.umeta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ustats{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.ustats b{color:var(--text)}
.uactions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tog{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;border-radius:999px;border:1px solid var(--line);background:rgba(5,10,40,.4);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.tog .sw{width:30px;height:18px;border-radius:999px;background:#5b6390;position:relative;transition:background .15s;flex:none}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{color:#fff}
.tog[aria-checked="true"] .sw{background:#43C463}
.tog[aria-checked="true"] .sw::after{transform:translateX(12px)}
.tog:disabled{opacity:.45;cursor:default}
.tog.adm[aria-checked="true"] .sw{background:#FFA000}
.feed{display:flex;flex-direction:column;max-height:70vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.ev{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;line-height:1.4}
.ev:last-child{border-bottom:none}
.ev .ic{font-size:17px;text-align:center}
.ev .t{color:var(--muted);font-size:11px}
.ev b{font-weight:700}
.filter-on{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 10px;margin-bottom:8px}
.filter-on button{width:20px;height:20px;border-radius:50%;border:none;background:rgba(255,255,255,.2);cursor:pointer;line-height:1}
.rooms{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.room{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.room.gone{opacity:.55}
.room .rcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:15px;letter-spacing:.12em}
.room .rinfo{flex:1;min-width:0}
.room .rmeta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.room .btn{height:32px;font-size:13px;padding:0 11px}
.badge.live{background:#1E9A47;color:#fff}
.badge.gone{background:var(--surface2);color:var(--muted)}
.delform{display:flex;gap:8px;margin-bottom:10px}
.delform .search{text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
.gate .card{max-width:380px;text-align:center;padding:26px 22px}
.gate p{color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101a52;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;max-width:90vw}
.toast.err{border-color:#E53935}
.modal{position:fixed;inset:0;background:rgba(3,6,25,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{max-width:380px;width:100%;text-align:center}
.modal p{color:var(--muted);line-height:1.45;margin:6px 0 16px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.love-footer{margin:28px 0 0;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em}
.love-heart{color:#FF4D6D;display:inline-block;margin:0 1px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.updated{font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.feed{max-height:none}}
@media (max-width:620px){
  .user{grid-template-columns:auto minmax(0,1fr)}
  .uactions{grid-column:1 / -1;justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .n{font-size:24px}
}

/* ---- Royal Night premium theme ---- */
:root{--bg1:#1A0B2E;--bg2:#07040F;--card:linear-gradient(160deg,rgba(48,22,82,.78),rgba(16,8,34,.86));--surface:rgba(255,255,255,.05);--surface2:rgba(233,196,106,.12);--line:rgba(233,196,106,.2);--text:#F8F2E4;--muted:#B9A8D2;--gold:#E9C46A;--gold-grad:linear-gradient(135deg,#FFF1C1 0%,#F2CE6E 28%,#C9922F 60%,#F6D98A 100%)}
html{background:#07040F}
html,body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
body{background:radial-gradient(900px 600px at 15% -10%,rgba(155,60,220,.35),transparent 60%),radial-gradient(800px 600px at 110% 20%,rgba(255,77,141,.16),transparent 60%),linear-gradient(180deg,#14072A,#0B0518 55%,#07040F) no-repeat}
.logo{font-family:'Cinzel',serif;letter-spacing:.06em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-family:'Plus Jakarta Sans',sans-serif;color:var(--gold);border-color:rgba(233,196,106,.4)}
.crown{width:34px;height:24px;flex:none}
.stat,.card{background:var(--card);border-color:var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(16px)}
.stat .n{font-family:'Cinzel',serif;color:#FBE7A8}
.stat.good .n{color:#7EF0A8}.stat.warn .n{color:#FF8FA8}
.card h2{font-family:'Cinzel',serif;letter-spacing:.05em;color:#FBE7A8}
.btn{border-color:rgba(233,196,106,.25);background:rgba(255,255,255,.06)}
.btn.gold{background:var(--gold-grad);color:#2B1700}
.btn.danger{background:linear-gradient(135deg,#FF5A7A,#C2183B)}
.btn.ok{background:linear-gradient(135deg,#2EC27E,#0E7A4B)}
.user{background:rgba(255,255,255,.04);border-color:rgba(233,196,106,.14)}
.av{background:var(--gold-grad);color:#2B1700}
.badge.admin{background:var(--gold-grad)}
.badge.blocked{background:linear-gradient(135deg,#FF5A7A,#C2183B)}
.chip.on{background:rgba(233,196,106,.16);border-color:rgba(233,196,106,.5);color:#FBE7A8}
.tog[aria-checked="true"] .sw{background:#2EC27E}
.tog.adm[aria-checked="true"] .sw{background:#E2B656}
.search,select{background:rgba(8,4,20,.6);border-color:rgba(233,196,106,.2)}
.search:focus,select:focus{border-color:#E9C46A}
.toast{background:rgba(20,9,40,.95);border-color:rgba(233,196,106,.4)}
.love-footer{font-family:'Cinzel',serif;letter-spacing:.08em}
.love-heart{color:#FF4D8D;text-shadow:0 0 12px rgba(255,77,141,.7)}
</style>
</head>

<div class="wrap">
  <div id="loading"><div class="spinner" aria-label="Loading"></div></div>

      <h1 class="logo" style="justify-content:center"><svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><defs><linearGradient id="cgE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C1"/><stop offset=".45" stop-color="#E2B656"/><stop offset="1" stop-color="#A8741F"/></linearGradient></defs><path d="M4 14 L18 26 L32 4 L46 26 L60 14 L54 37 H10 Z" fill="url(#cgE)" stroke="#7A4E0E" stroke-width="1.5" stroke-linejoin="round"/><rect x="9" y="36" width="46" height="6" rx="2" fill="url(#cgE)" stroke="#7A4E0E" stroke-width="1.5"/><circle cx="4" cy="13" r="3.2" fill="#FF4D8D" stroke="none"/><circle cx="32" cy="4" r="3.6" fill="#FF4D8D" stroke="none"/><circle cx="60" cy="13" r="3.2" fill="#FF4D8D" stroke="none"/><circle cx="22" cy="30" r="2.2" fill="#3aa0ff" stroke="none"/><circle cx="32" cy="30" r="2.6" fill="#38d47a" stroke="none"/><circle cx="42" cy="30" r="2.2" fill="#3aa0ff" stroke="none"/></svg>LUDO <span>QUEEN</span></h1>

  <div id="app" class="hidden">

      <h1 class="logo"><svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><defs><linearGradient id="cgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C1"/><stop offset=".45" stop-color="#E2B656"/><stop offset="1" stop-color="#A8741F"/></linearGradient></defs><path d="M4 14 L18 26 L32 4 L46 26 L60 14 L54 37 H10 Z" fill="url(#cgD)" stroke="#7A4E0E" stroke-width="1.5" stroke-linejoin="round"/><rect x="9" y="36" width="46" height="6" rx="2" fill="url(#cgD)" stroke="#7A4E0E" stroke-width="1.5"/><circle cx="4" cy="13" r="3.2" fill="#FF4D8D" stroke="none"/><circle cx="32" cy="4" r="3.6" fill="#FF4D8D" stroke="none"/><circle cx="60" cy="13" r="3.2" fill="#FF4D8D" stroke="none"/><circle cx="22" cy="30" r="2.2" fill="#3aa0ff" stroke="none"/><circle cx="32" cy="30" r="2.6" fill="#38d47a" stroke="none"/><circle cx="42" cy="30" r="2.2" fill="#3aa0ff" stroke="none"/></svg>LUDO <span>QUEEN</span><small>Admin</small></h1>
      <div class="who">
        <span>Signed in as <b id="meEmail"></b></span>
        <button id="refreshBtn" class="btn" title="Refresh now">↻ Refresh</button>
        <a class="btn" href="/">Back to game</a>
        <button id="logoutBtn" class="btn">Log out</button>
      </div>
    </header>

    <section class="stats" aria-label="Summary">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total players</div></div>
      <div class="stat good"><div class="n" id="sOnline">0</div><div class="l">Online now</div></div>

    <div class="grid">
      <section class="card">
        <h2>Players <span class="updated" id="updated"></span></h2>

          <input id="search" class="search" type="search" placeholder="Search name or email…" aria-label="Search players">

        <h2>Activity

        <div id="feed" class="feed"></div>
      </section>
    </div>
  </div>
  <p class="love-footer">made for my love h<span class="love-heart" aria-label="love">❤</span>j</p>
</div>

<div id="confirm" class="modal hidden" role="alertdialog" aria-labelledby="cfTitle" aria-describedby="cfText">
  <div class="card">
    <h2 id="cfTitle" style="justify-content:center"></h2>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
/* Ludo Queen – accounts (Supabase): sign up / log in, the player's rights, activity log, join passes */
(function () {
  'use strict';
  const CFG = window.LY_SUPABASE || {
    url: 'https://eiqzfillulivvfsjxiaw.supabase.co',
    key: 'sb_publishable_lNDzhh_4n8akw43h560Pzw_-lJSJuBO',
  };
  const lib = window.supabase;
  const sb = lib && lib.createClient ? lib.createClient(CFG.url, CFG.key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  }) : null;

  let session = null, profile = null;
  const listeners = [];
  const emit = () => listeners.forEach(fn => { try { fn(profile); } catch (e) { console.error(e); } });

  function niceError(err) {
    const m = String((err && (err.message || err.error_description)) || err || '');
    if (/invalid login credentials/i.test(m)) return 'Wrong email or password.';
    if (/already registered|already exists/i.test(m)) return 'This email already has an account — log in instead.';
    if (/password should be at least/i.test(m)) return 'Password needs at least 6 characters.';
    if (/unable to validate email|invalid email|email address .* is invalid/i.test(m)) return 'Please enter a valid email address.';
    if (/rate limit|too many/i.test(m)) return 'Too many tries — please wait a minute and try again.';
    if (/account blocked/i.test(m)) return 'Your account has been blocked by the admin.';
    if (/failed to fetch|network/i.test(m)) return 'No internet connection. Check your network and try again.';
    return m || 'Something went wrong. Please try again.';
  }

  async function loadProfile() {
    if (!sb || !session) { profile = null; return null; }
    const { data, error } = await sb.from('profiles')
      .select('id,email,display_name,role,banned,can_call,can_chat,games_played,games_won,rooms_created')
      .eq('id', session.user.id).maybeSingle();
    if (error) throw error;
    profile = data || null;
    return profile;
  }

  const Auth = {
    ready: false,
    available: !!sb,
    client: sb,
    get user() { return session ? session.user : null; },
    get profile() { return profile; },
    get isAdmin() { return !!(profile && profile.role === 'admin' && !profile.banned); },
    niceError,
    onChange(fn) { listeners.push(fn); },

    async init() {
      if (!sb) { Auth.ready = true; return null; }
      try {
        const { data } = await sb.auth.getSession();
        session = data.session;
        if (session) await loadProfile();
      } catch (e) { console.warn('auth init', e); }
      sb.auth.onAuthStateChange((ev, s) => {
        session = s;
        if (ev === 'SIGNED_OUT') { profile = null; emit(); }
        if (ev === 'PASSWORD_RECOVERY' && Auth.onRecovery) Auth.onRecovery();
      });
      Auth.ready = true;
      return profile;
    },

    async signUp(name, email, password) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
      if (error) throw new Error(niceError(error));
      if (!data.session) throw new Error('Account created — please check your email to confirm it, then log in.');
      session = data.session;
      await loadProfile();
      Auth.log('login');
      emit();
      return profile;
    },

    async signIn(email, password) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(niceError(error));
      session = data.session;
      await loadProfile();
      if (profile && profile.banned) { await sb.auth.signOut(); session = null; profile = null; throw new Error(niceError('account blocked')); }
      Auth.log('login');
      emit();
      return profile;
    },

    async signOut() {
      if (!sb) return;
      await Auth.log('logout');
      await sb.auth.signOut();
      session = null; profile = null;
      emit();
    },

    async resetPassword(email) {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/' });
      if (error) throw new Error(niceError(error));
    },
    async setNewPassword(password) {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw new Error(niceError(error));
    },

    async refresh() {
      if (!sb || !session) return null;
      try { await loadProfile(); emit(); } catch (e) {}
      return profile;
    },

    async setName(name) {
      if (!sb || !session || !profile || profile.display_name === name) return;
      const { error } = await sb.rpc('set_display_name', { p_name: name });
      if (!error) profile.display_name = name;
    },

    // fire-and-forget activity log (never blocks the game)
    async log(kind, room, detail) {
      if (!sb || !session) return;
      try { await sb.rpc('log_activity', { p_kind: kind, p_room: room || null, p_detail: detail || {} }); } catch (e) {}
    },
    async touch() { if (sb && session) { try { await sb.rpc('touch_seen'); } catch (e) {} } },

    // a one-time pass the player hands to the room host (valid 2 minutes, one room)
    async joinPass(room) {
      const { data, error } = await sb.rpc('make_join_proof', { p_room: room });
      if (error) throw new Error(niceError(error));
      return data;
    },
    // host: turn a pass into the verified player (null when the pass is fake, used or expired)
    async checkPass(pass, room) {
      if (!sb || !pass) return null;
      const { data, error } = await sb.rpc('claim_join_proof', { p_nonce: pass, p_room: room });
      if (error || !data || !data.length) return null;
      return data[0];
    },
    // host: has the admin deleted this room since it was made?
    async roomClosed(code, since) {
      if (!sb || !code) return false;
      const { data, error } = await sb.rpc('room_closed', { p_room: code, p_since: new Date(since || 0).toISOString() });
      return !error && data === true;
    },
    // host: latest rights of the players in the room
    async rightsOf(ids) {
      if (!sb || !ids.length) return [];
      const { data, error } = await sb.rpc('rights_for', { p_ids: ids });
      return error ? null : data;
    },
  };
  window.LYAuth = Auth;
})();

</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const Auth = window.LYAuth, sb = Auth.client;
  let users = [], events = [], filter = 'all', userFilter = null, busy = new Set();

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    kids.flat().forEach(k => { if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k))); });
    return el;
  }
  let toastT;
  function toast(t, err) {
    const el = $('toast'); el.textContent = t; el.classList.toggle('err', !!err); el.classList.remove('hidden');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hidden'), 3200);
  }
  function ago(ts) {
    if (!ts) return 'never';
    const s = Math.max(0, (Date.now() - new Date(ts)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago';
    return new Date(ts).toLocaleDateString();
  }
  const isOnline = u => u.last_seen_at && Date.now() - new Date(u.last_seen_at) < 3 * 60 * 1000;
  const nameOf = id => { const u = users.find(x => x.id === id); return u ? (u.display_name || u.email) : 'someone'; };

  function gate(text) {
    $('loading').classList.add('hidden'); $('app').classList.add('hidden');
    $('gateText').textContent = text; $('gate').classList.remove('hidden');
  }

  async function load() {
    const [u, a] = await Promise.all([
      sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(2000),
      (() => {
        let q = sb.from('activity').select('id,user_id,kind,room_code,detail,created_at').order('created_at', { ascending: false }).limit(200);
        if (userFilter) q = q.eq('user_id', userFilter);
        const k = $('kindFilter').value; if (k) q = q.eq('kind', k);
        return q;
      })(),
    ]);
    if (u.error) throw u.error;
    if (a.error) throw a.error;
    users = u.data; events = a.data;
    await loadRooms();
    $('updated').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    renderStats(); renderUsers(); renderFeed();
  }

  // ---- rooms: built from the activity log (rooms live on the host's phone, not on the server) ----
  let rooms = [];
  const ROOM_KINDS = ['room_create', 'room_join', 'game_start', 'game_end', 'game_win', 'leave', 'room_deleted'];
  async function loadRooms() {
    const since = new Date(Date.now() - 2 * 86400000).toISOString();
    const [r, c] = await Promise.all([
      sb.from('activity').select('user_id,kind,room_code,created_at').in('kind', ROOM_KINDS).not('room_code', 'is', null)
        .gte('created_at', since).order('created_at', { ascending: false }).limit(1500),
      sb.from('closed_rooms').select('code,closed_at'),
    ]);
    if (r.error) throw r.error;
    const closed = new Map(((c && c.data) || []).map(x => [x.code, new Date(x.closed_at).getTime()]));
    const by = new Map();
    r.data.forEach(e => {
      const code = String(e.room_code).toUpperCase(), t = new Date(e.created_at).getTime();
      let x = by.get(code);
      if (!x) by.set(code, x = { code, host: null, start: t, last: 0, people: new Set(), games: 0 });
      if (e.kind === 'room_deleted') return;
      x.last = Math.max(x.last, t); x.start = Math.min(x.start, t);
      if (e.kind === 'room_create') { x.host = e.user_id; x.start = t; }
      if (e.kind === 'game_start') x.games++;
      if (e.user_id && e.kind !== 'leave') x.people.add(e.user_id);
    });
    rooms = [...by.values()].filter(x => x.last).map(x => {
      const ct = closed.get(x.code);
      x.deleted = ct != null && ct >= x.start - 60000;
      return x;
    }).sort((a, b) => b.last - a.last).slice(0, 40);
    renderRooms();
  }
  function renderRooms() {
    const box = $('rooms'); box.innerHTML = '';
    if (!rooms.length) { box.append(h('div', { class: 'empty' }, 'No rooms in the last 2 days.')); return; }
    rooms.forEach(x => {
      const live = !x.deleted && Date.now() - x.last < 3 * 3600000;
      box.append(h('div', { class: 'room' + (x.deleted ? ' gone' : '') },
        h('div', { class: 'rinfo' },
          h('div', { class: 'uname' }, h('span', { class: 'rcode' }, x.code),
            x.deleted ? h('span', { class: 'badge gone' }, 'DELETED') : live && h('span', { class: 'badge live' }, 'RECENT')),
          h('div', { class: 'rmeta' }, `${x.host ? 'by ' + nameOf(x.host) + ' · ' : ''}${x.people.size} player${x.people.size === 1 ? '' : 's'} · ${x.games} game${x.games === 1 ? '' : 's'} · last activity ${ago(x.last)}`)),
        !x.deleted && h('button', { class: 'btn danger', disabled: busy.has('room:' + x.code), onclick: () => askDeleteRoom(x.code) }, 'Delete')));
    });
  }
  function askDeleteRoom(code) {
    confirmBox(`Delete room ${code}?`,
      'Everyone in this room is sent back to the lobby and the game in it ends. The room code stops working. This cannot be undone.',
      'Delete room', () => deleteRoom(code));
  }
  async function deleteRoom(code) {
    busy.add('room:' + code); renderRooms();
    const { error } = await sb.rpc('admin_close_room', { p_room: code });
    busy.delete('room:' + code);
    if (error) { toast(Auth.niceError(error), true); renderRooms(); return; }
    // tell the room's host straight away (the host also checks every 20 seconds)
    try {
      const ch = sb.channel('ly-room-' + code, { config: { broadcast: { self: false } } });
      ch.subscribe(st => {
        if (st !== 'SUBSCRIBED') return;
        ch.send({ type: 'broadcast', event: 'adm', payload: { t: 'closed' } });
        setTimeout(() => sb.removeChannel(ch), 2000);
      });
    } catch (e) {}
    toast(`Room ${code} deleted — its players are sent back to the lobby`);
    refresh();
  }
  $('delForm').addEventListener('submit', e => {
    e.preventDefault();
    const code = $('delCode').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{4,8}$/.test(code)) { toast('Enter a valid room code', true); return; }
    $('delCode').value = '';
    askDeleteRoom(code);
  });

  function renderStats() {
    const day = Date.now() - 86400000;
    $('sTotal').textContent = users.length;
    $('sOnline').textContent = users.filter(isOnline).length;
    $('sToday').textContent = users.filter(u => u.last_seen_at && new Date(u.last_seen_at) > day).length;
    $('sBlocked').textContent = users.filter(u => u.banned).length;
    $('sGames').textContent = users.reduce((n, u) => n + (u.games_played || 0), 0);
    $('sRooms').textContent = users.reduce((n, u) => n + (u.rooms_created || 0), 0);
  }

  function toggle(label, on, onClick, opts) {
    return h('button', { class: 'tog' + (opts && opts.adm ? ' adm' : ''), role: 'switch', 'aria-checked': String(!!on), disabled: opts && opts.disabled, title: opts && opts.title, onclick: onClick },
      h('span', { class: 'sw', 'aria-hidden': 'true' }), label);
  }

  function renderUsers() {
    const q = $('search').value.trim().toLowerCase();
    let list = users.filter(u => !q || (u.display_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
    if (filter === 'online') list = list.filter(isOnline);
    if (filter === 'admin') list = list.filter(u => u.role === 'admin');
    if (filter === 'blocked') list = list.filter(u => u.banned);
    if (filter === 'limited') list = list.filter(u => !u.can_call || !u.can_chat);
    const sort = $('sort').value;
    const t = v => (v ? new Date(v).getTime() : 0);
    list.sort(sort === 'new' ? (a, b) => t(b.created_at) - t(a.created_at)
      : sort === 'games' ? (a, b) => (b.games_played || 0) - (a.games_played || 0)
      : sort === 'name' ? (a, b) => (a.display_name || '').localeCompare(b.display_name || '')
      : (a, b) => t(b.last_seen_at) - t(a.last_seen_at));
    const box = $('users'); box.innerHTML = '';
    if (!list.length) { box.append(h('div', { class: 'empty' }, users.length ? 'No players match.' : 'No players yet.')); return; }
    const myId = Auth.user.id;
    list.forEach(u => {
      const me = u.id === myId, b = busy.has(u.id);
      box.append(h('div', { class: 'user' + (u.banned ? ' blocked' : '') },
        h('div', { class: 'av', 'aria-hidden': 'true' }, (u.display_name || u.email || '?').trim().charAt(0).toUpperCase(), isOnline(u) && h('span', { class: 'dot' })),
        h('div', { class: 'uinfo' },
          h('div', { class: 'uname' },
            h('button', { title: 'Show this player\'s activity', onclick: () => showUserActivity(u) }, u.display_name || '(no name)'),
            u.role === 'admin' && h('span', { class: 'badge admin' }, 'ADMIN'),
            u.banned && h('span', { class: 'badge blocked' }, 'BLOCKED'),
            me && h('span', { class: 'badge you' }, 'YOU')),
          h('div', { class: 'umeta' }, `${u.email || ''} · joined ${ago(u.created_at)} · ${isOnline(u) ? 'online now' : 'seen ' + ago(u.last_seen_at)}`),
          h('div', { class: 'ustats' },
            h('span', null, h('b', null, u.games_played || 0), ' games'),
            h('span', null, h('b', null, u.games_won || 0), ' wins'),
            h('span', null, h('b', null, u.rooms_created || 0), ' rooms'))),
        h('div', { class: 'uactions' },
          toggle('Calls', u.can_call, () => setRight(u, 'can_call', !u.can_call), { disabled: b }),
          toggle('Chat', u.can_chat, () => setRight(u, 'can_chat', !u.can_chat), { disabled: b }),
          toggle('Admin', u.role === 'admin', () => askAdmin(u), { adm: true, disabled: b || me, title: me ? 'You cannot change your own admin role' : null }),
          u.banned
            ? h('button', { class: 'btn ok', disabled: b, onclick: () => setRight(u, 'banned', false) }, 'Unblock')
            : h('button', { class: 'btn danger', disabled: b || me, title: me ? 'You cannot block yourself' : null, onclick: () => askBlock(u) }, 'Block'))));
    });
  }

  const LABEL = {
    signup: ['🆕', u => [h('b', null, u), ' signed up']],
    login: ['🔑', u => [h('b', null, u), ' logged in']],
    logout: ['👋', u => [h('b', null, u), ' logged out']],
    room_deleted: ['🗑️', (u, e) => [h('b', null, u), ' deleted room ', h('b', null, e.room_code || '')]],
    room_create: ['🏠', (u, e) => [h('b', null, u), ' created room ', h('b', null, e.room_code || '')]],
    room_join: ['➡️', (u, e) => [h('b', null, u), ' joined room ', h('b', null, e.room_code || '')]],
    game_start: ['🎲', (u, e) => [h('b', null, u), ` started a game (${(e.detail && e.detail.players) || '?'} players) in `, h('b', null, e.room_code || '')]],
    game_win: ['🏆', (u, e) => [h('b', null, u), ' won a game in ', h('b', null, e.room_code || '')]],
    game_end: ['🏁', (u, e) => [h('b', null, u), ` finished a game${e.detail && e.detail.place > 0 ? ' #' + e.detail.place : ''} in `, h('b', null, e.room_code || '')]],
    leave: ['🚪', (u, e) => [h('b', null, u), ' left room ', h('b', null, e.room_code || '')]],
    admin_change: ['🛡️', (u, e) => {
      const d = e.detail || {}, by = nameOf(d.by);
      const what = d.field === 'banned' ? (d.value ? 'blocked' : 'unblocked')
        : d.field === 'admin' ? (d.value ? 'made admin' : 'removed as admin')
        : `${d.value ? 'turned on' : 'turned off'} ${d.field === 'can_call' ? 'calls' : 'chat'} for`;
      return d.field === 'banned' || d.field === 'admin'
        ? [h('b', null, by), ` ${what} `, h('b', null, u)]
        : [h('b', null, by), ` ${what} `, h('b', null, u)];
    }],
  };
  function renderFeed() {
    const box = $('feed'); box.innerHTML = '';
    if (!events.length) { box.append(h('div', { class: 'empty' }, 'No activity yet.')); return; }
    events.forEach(e => {
      const [ic, fn] = LABEL[e.kind] || ['•', u => [h('b', null, u), ' ' + e.kind]];
      box.append(h('div', { class: 'ev' }, h('div', { class: 'ic', 'aria-hidden': 'true' }, ic),
        h('div', null, h('div', null, fn(nameOf(e.user_id), e)), h('div', { class: 't' }, ago(e.created_at) + ' · ' + new Date(e.created_at).toLocaleString()))));
    });
  }

  function showUserActivity(u) {
    userFilter = u.id;
    $('userFilterName').textContent = 'Showing: ' + (u.display_name || u.email);
    $('userFilter').classList.remove('hidden');
    refresh();
    if (innerWidth < 980) $('feed').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('clearUser').onclick = () => { userFilter = null; $('userFilter').classList.add('hidden'); refresh(); };

  let cfAction = null;
  function confirmBox(title, text, yes, action) {
    $('cfTitle').textContent = title; $('cfText').textContent = text; $('cfYes').textContent = yes;
    cfAction = action; $('confirm').classList.remove('hidden'); $('cfNo').focus();
  }
  $('cfNo').onclick = () => { $('confirm').classList.add('hidden'); cfAction = null; };
  $('cfYes').onclick = () => { $('confirm').classList.add('hidden'); const a = cfAction; cfAction = null; if (a) a(); };
  $('confirm').addEventListener('click', e => { if (e.target.id === 'confirm') $('cfNo').click(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$('confirm').classList.contains('hidden')) $('cfNo').click(); });

  function askBlock(u) {
    confirmBox(`Block ${u.display_name}?`, 'They will be logged out, removed from any game they are in, and will not be able to log in until you unblock them.', 'Block', () => setRight(u, 'banned', true));
  }
  function askAdmin(u) {
    const make = u.role !== 'admin';
    confirmBox(make ? `Make ${u.display_name} an admin?` : `Remove ${u.display_name} as admin?`,
      make ? 'Admins can open this panel, block players and change everyone\'s permissions.' : 'They will lose access to this panel.',
      make ? 'Make admin' : 'Remove admin', () => setRight(u, 'admin', make));
  }

  async function setRight(u, field, value) {
    busy.add(u.id); renderUsers();
    const { error } = await sb.rpc('admin_set_user', { p_id: u.id, p_field: field, p_value: value });
    busy.delete(u.id);
    if (error) { toast(Auth.niceError(error), true); renderUsers(); return; }
    if (field === 'admin') u.role = value ? 'admin' : 'user'; else u[field] = value;
    const msg = {
      banned: value ? `${u.display_name} is blocked` : `${u.display_name} is unblocked`,
      can_call: `Calls ${value ? 'on' : 'off'} for ${u.display_name}`,
      can_chat: `Chat & emojis ${value ? 'on' : 'off'} for ${u.display_name}`,
      admin: value ? `${u.display_name} is now an admin` : `${u.display_name} is no longer an admin`,
    }[field];
    toast(field === 'admin' ? msg : msg + ' — running games update within 30 seconds');
    renderStats(); renderUsers(); refresh();
  }

  let loadingNow = false;
  async function refresh() {
    if (loadingNow) return;
    loadingNow = true;
    try { await load(); } catch (e) { toast(Auth.niceError(e), true); }
    finally { loadingNow = false; }
  }
  $('refreshBtn').onclick = refresh;
  $('search').addEventListener('input', renderUsers);
  $('sort').addEventListener('change', renderUsers);
  $('kindFilter').addEventListener('change', refresh);
  $('filters').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.f;
    [...$('filters').children].forEach(c => c.classList.toggle('on', c === b));
    renderUsers();
  });
  $('logoutBtn').onclick = async () => { await Auth.signOut(); location.href = '/'; };

  (async () => {
    if (!Auth.available) return gate("Can't reach the login server. Check your internet and reload.");
    await Auth.init();
    if (!Auth.profile) return gate('Please log in to the game first, then open the admin panel again.');
    if (!Auth.isAdmin) return gate('Only admins can open this page.');
    $('meEmail').textContent = Auth.profile.email || Auth.profile.display_name;
    try { await load(); } catch (e) { return gate(Auth.niceError(e)); }
    $('loading').classList.add('hidden'); $('app').classList.remove('hidden');
    setInterval(() => { if (!document.hidden) refresh(); }, 30000);
    Auth.touch();
  })();
})();
</script>
</body>
